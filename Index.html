<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Aetheria: Les Ruines de Drakmor - RPG 2D Complet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;overflow:hidden;font-family:'Georgia',serif;color:#e0d0b0;touch-action:none;width:100vw;height:100vh;user-select:none}
#c{display:block;image-rendering:pixelated}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto} 

#title{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#1a0a2e,#0d1b2a,#1b263b);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#title h1{font-size:clamp(28px,8vw,64px);color:#ffd700;text-shadow:0 0 20px #ff8c00;margin-bottom:10px;text-align:center;letter-spacing:4px;animation:tp 3s ease-in-out infinite}
@keyframes tp{0%,100%{text-shadow:0 0 20px #ff8c00}50%{text-shadow:0 0 30px #ff8c00,0 0 60px rgba(255,140,0,.6)}}
#title h2{font-size:clamp(14px,3.5vw,22px);color:#b0a080;margin-bottom:40px;font-style:italic;text-align:center;padding:0 20px}
.btn{background:linear-gradient(135deg,#4a3b2a,#2a1f14);border:2px solid #8b7355;color:#e0d0b0;padding:15px 40px;font-size:clamp(14px,3vw,20px);margin:10px;cursor:pointer;border-radius:8px;font-family:'Georgia',serif;transition:all .3s;min-width:220px;text-align:center}
.btn:hover{border-color:#ffd700;box-shadow:0 0 15px rgba(255,215,0,.3);transform:scale(1.05)} 

#cc{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#1a0a2e,#0d1b2a);display:none;flex-direction:column;align-items:center;padding:15px;z-index:90;overflow-y:auto}
#cc h2{color:#ffd700;font-size:clamp(18px,4vw,32px);margin-bottom:12px;text-shadow:0 0 10px #ff8c00}
.cs{background:rgba(0,0,0,.5);border:1px solid #8b7355;border-radius:10px;padding:12px;margin:6px 0;width:100%;max-width:500px}
.cs h3{color:#daa520;margin-bottom:8px;font-size:clamp(14px,3vw,18px)}
.cg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cd{background:#1a1a2e;border:2px solid #4a4a6a;border-radius:8px;padding:10px;cursor:pointer;text-align:center;transition:all .3s}
.cd:hover,.cd.s{border-color:#ffd700;background:#2a2a4e;box-shadow:0 0 10px rgba(255,215,0,.2)}
.cd .ci{font-size:28px;margin-bottom:4px}
.cd .cn{font-weight:bold;color:#e0d0b0;font-size:clamp(12px,2.5vw,15px)}
.cd .cdsc{font-size:clamp(9px,2vw,11px);color:#888;margin-top:3px}
input[type="text"]{background:#1a1a2e;border:1px solid #8b7355;color:#e0d0b0;padding:10px;border-radius:5px;width:100%;font-size:16px;font-family:'Georgia',serif}
.cp{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.co{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all .2s}
.co.s{border-color:#ffd700;box-shadow:0 0 10px rgba(255,215,0,.5);transform:scale(1.2)} 

#h{position:absolute;top:0;left:0;width:100%;padding:6px;display:none;pointer-events:none;z-index:20}
.ht{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:4px}
.hp{background:rgba(0,0,0,.75);border:1px solid #8b7355;border-radius:8px;padding:5px 8px;pointer-events:auto}
.hb,.mb,.xb{width:100px;height:12px;background:#333;border-radius:6px;overflow:hidden;margin:2px 0;border:1px solid #555}
.hf{height:100%;background:linear-gradient(90deg,#8b0000,#ff4444);transition:width .3s}
.mf{height:100%;background:linear-gradient(90deg,#00008b,#4444ff);transition:width .3s}
.xf{height:100%;background:linear-gradient(90deg,#006400,#44ff44);transition:width .3s}
.htx{font-size:clamp(9px,2vw,11px);color:#e0d0b0}
.hg{color:#ffd700;font-weight:bold}
.hl{color:#daa520;font-weight:bold} 

#inv{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:92%;max-width:500px;max-height:85%;background:rgba(10,10,20,.97);border:2px solid #8b7355;border-radius:12px;padding:12px;display:none;z-index:50;overflow-y:auto}
#inv h3{color:#ffd700;text-align:center;margin-bottom:8px;font-size:clamp(16px,3vw,22px)}
#ic{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.is{aspect-ratio:1;background:rgba(255,255,255,.05);border:1px solid #4a4a6a;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4vw,22px);cursor:pointer;position:relative}
.is .ic{position:absolute;bottom:1px;right:3px;font-size:9px;color:#fff}

#dlg{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);width:92%;max-width:600px;background:rgba(0,0,0,.92);border:2px solid #8b7355;border-radius:12px;padding:12px;display:none;z-index:40}
#pm{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:60}

#tc{position:absolute;bottom:15px;left:15px;display:none;z-index:30}
.dp{position:relative;width:130px;height:130px}
.db{position:absolute;width:40px;height:40px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
.du{top:0;left:45px} .dd{bottom:0;left:45px} .dl{top:45px;left:0} .dr{top:45px;right:0}
#ab{position:absolute;bottom:15px;right:15px;display:none;z-index:30;gap:8px}
.ab{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}

#na{position:absolute;top:55px;right:8px;z-index:35;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.n{background:rgba(0,0,0,.85);border-left:3px solid #ffd700;padding:6px 10px;font-size:12px;animation:si .3s}
@keyframes si{from{transform:translateX(50px);opacity:0}to{transform:translateX(0);opacity:1}}
#mm{position:absolute;top:8px;right:8px;width:90px;height:90px;background:rgba(0,0,0,.7);border:2px solid #8b7355;border-radius:8px;display:none;z-index:20}
</style>
</head>
<body>
<canvas id="c"></canvas> 

<div id="title">
<h1>⚔️ AETHERIA ⚔️</h1>
<h2>Les Ruines de Drakmor</h2>
<button class="btn" onclick="startNewGame()">🎮 Nouvelle Partie</button>
</div> 

<div id="cc">
<h2>⚔️ Création du Héros ⚔️</h2>
<div class="cs">
<h3>📝 Nom</h3>
<input type="text" id="cn" placeholder="Héros" maxlength="16">
</div>
<div class="cs">
<h3>🎨 Couleur</h3>
<div class="cp">
<div class="co s" style="background:#c0392b" onclick="scl='#c0392b'"></div>
<div class="co" style="background:#2980b9" onclick="scl='#2980b9'"></div>
<div class="co" style="background:#27ae60" onclick="scl='#27ae60'"></div>
</div>
</div>
<div class="cs">
<h3>⚔️ Classe</h3>
<div class="cg">
<div class="cd s" onclick="sc='warrior'">🛡️ Guerrier</div>
<div class="cd" onclick="sc='mage'">🔮 Mage</div>
</div>
</div>
<button class="btn" onclick="confirmCreation()">✨ Commencer</button>
</div> 

<div id="h">
<div class="ht">
<div class="hp">
<div class="htx">❤️ <span id="hhp">100/100</span></div>
<div class="hb"><div class="hf" id="hpb" style="width:100%"></div></div>
<div class="htx">🪙 <span id="hgd">0</span></div>
</div>
<div class="hp">
<div class="htx">🗺️ <span id="hzn">Village</span></div>
</div>
</div>
</div> 

<div id="inv">
<h3>🎒 Inventaire</h3>
<div id="ic"></div>
<button class="btn" onclick="toggleInventory()">❌ Fermer</button>
</div> 

<div id="pm">
<h2>⏸️ Pause</h2>
<button class="btn" onclick="resumeGame()">▶️ Reprendre</button>
</div> 

<div id="tc">
<div class="dp">
<div class="db du" onmousedown="ti.u=true" onmouseup="ti.u=false">▲</div>
<div class="db dd" onmousedown="ti.d=true" onmouseup="ti.d=false">▼</div>
<div class="db dl" onmousedown="ti.l=true" onmouseup="ti.l=false">◀</div>
<div class="db dr" onmousedown="ti.r=true" onmouseup="ti.r=false">▶</div>
</div>
</div>
<div id="ab">
<div class="ab" onclick="attack()">⚔️</div>
</div> 

<div id="na"></div>
<canvas id="mm"></canvas> 

<script>
const c=document.getElementById('c'), x=c.getContext('2d');
let TS=32, VW=20, VH=15, gs='title', lt=0, p=null, sc='warrior', scl='#c0392b', cm=null, cmi='village', ms={}, ca={x:0,y:0}, k={}, ti={u:false,d:false,l:false,r:false}, eq={w:null,a:null};

const CS={
    warrior:{hp:150,str:15,icon:'⚔️',startWeapon:'iron_sword'},
    mage:{hp:80,str:5,icon:'🔮',startWeapon:'wooden_staff'}
};

const IT={
    iron_sword:{n:'Épée',i:'⚔️',t:'weapon',dmg:10},
    wooden_staff:{n:'Bâton',i:'🪄',t:'weapon',dmg:5},
    health_potion:{n:'Soin',i:'🧪',t:'consumable',v:50,ef:'heal'}
};

const TC={grass:'#2d5016',wall:'#4a4a4a',road:'#8B7355',water:'#1e3a5f',floor:'#6b5b4f',door:'#8B4513'};

function init() {
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('keydown', e => { k[e.key.toLowerCase()] = true; if(e.key===' ') attack(); if(e.key==='i') toggleInventory(); });
    window.addEventListener('keyup', e => k[e.key.toLowerCase()] = false);
    if ('ontouchstart' in window) { document.getElementById('tc').style.display = 'block'; document.getElementById('ab').style.display = 'flex'; }
    genMaps();
    requestAnimationFrame(loop);
}

function resize() {
    c.width = window.innerWidth; c.height = window.innerHeight;
    TS = Math.floor(Math.min(c.width/16, c.height/12));
    VW = Math.ceil(c.width/TS); VH = Math.ceil(c.height/TS);
}

function genMaps() {
    ms['village'] = {w:30,h:20,n:'Village',t:Array.from({length:20},()=>Array(30).fill('grass')),e:[],ex:[{x:29,y:10,tg:'forest',tx:1,ty:10}]};
    ms['village'].t[10].fill('road');
    ms['village'].e.push({type:'chest',x:5,y:5,open:false,loot:[{id:'health_potion',qty:1}]});
    
    ms['forest'] = {w:30,h:20,n:'Forêt',t:Array.from({length:20},()=>Array(30).fill('grass')),e:[],ex:[{x:0,y:10,tg:'village',tx:28,ty:10}]};
    for(let i=0;i<15;i++) ms['forest'].e.push({type:'enemy',sub:'slime',x:10+i,y:5+i%10,hp:30});
}

function startNewGame() {
    document.getElementById('title').style.display = 'none';
    document.getElementById('cc').style.display = 'flex';
}

function confirmCreation() {
    const base = CS[sc];
    p = { x:10, y:10, dir:'down', hp:base.hp, mhp:base.hp, str:base.str, gd:0, xp:0, mxp:100, inv:[{id:base.startWeapon,qty:1}], col:scl };
    document.getElementById('cc').style.display = 'none';
    document.getElementById('h').style.display = 'block';
    gs = 'play';
    changeMap('village', 10, 10);
}

function changeMap(id, tx, ty) {
    cm = ms[id]; cmi = id; p.x = tx; p.y = ty;
    notify("Entrée : " + cm.n);
}

function loop(t) {
    let dt = t - lt; lt = t;
    if (gs === 'play') { update(dt); draw(); }
    requestAnimationFrame(loop);
}

function update(dt) {
    let dx=0, dy=0;
    if(k.z || k.arrowup || ti.u) {dy=-1; p.dir='up';}
    else if(k.s || k.arrowdown || ti.d) {dy=1; p.dir='down';}
    else if(k.q || k.arrowleft || ti.l) {dx=-1; p.dir='left';}
    else if(k.d || k.arrowright || ti.r) {dx=1; p.dir='right';}

    if((dx!==0 || dy!==0) && !p.mving) {
        let nx = p.x+dx, ny = p.y+dy;
        if(nx>=0 && nx<cm.w && ny>=0 && ny<cm.h && cm.t[ny][nx] !== 'wall') {
            p.x = nx; p.y = ny;
            p.mving = true; setTimeout(()=>p.mving=false, 150);
            cm.ex.forEach(ex => { if(ex.x===p.x && ex.y===p.y) changeMap(ex.tg, ex.tx, ex.ty); });
        }
    }
    ca.x = p.x - VW/2; ca.y = p.y - VH/2;
    document.getElementById('hhp').innerText = `${p.hp}/${p.mhp}`;
    document.getElementById('hpb').style.width = (p.hp/p.mhp*100)+'%';
}

function draw() {
    x.clearRect(0,0,c.width,c.height);
    for(let y=0; y<cm.h; y++) {
        for(let xpos=0; xpos<cm.w; xpos++) {
            x.fillStyle = TC[cm.t[y][xpos]];
            x.fillRect((xpos-ca.x)*TS, (y-ca.y)*TS, TS+1, TS+1);
        }
    }
    cm.e.forEach(e => {
        x.font = TS+'px Arial';
        x.fillText(e.type==='chest'?(e.open?'🔓':'🎁'):'🟢', (e.x-ca.x)*TS, (e.y-ca.y+0.8)*TS);
    });
    x.fillStyle = p.col;
    x.fillText('🧙', (p.x-ca.x)*TS, (p.y-ca.y+0.8)*TS);
}

function attack() {
    let tx=p.x, ty=p.y;
    if(p.dir==='up') ty--; else if(p.dir==='down') ty++; else if(p.dir==='left') tx--; else if(p.dir==='right') tx++;
    let target = cm.e.find(e => e.x===tx && e.y===ty);
    if(target && target.type==='enemy') {
        target.hp -= p.str; notify("Touche l'ennemi !");
        if(target.hp <= 0) { cm.e = cm.e.filter(e=>e!==target); p.gd+=5; notify("Ennemi vaincu !"); }
    } else if(target && target.type==='chest' && !target.open) {
        target.open = true; target.loot.forEach(l => { p.inv.push(l); notify("Trouvé: "+IT[l.id].n); });
    }
}

function notify(t) {
    let n=document.createElement('div'); n.className='n'; n.innerText=t;
    document.getElementById('na').appendChild(n); setTimeout(()=>n.remove(), 2000);
}

function toggleInventory() {
    let i=document.getElementById('inv');
    i.style.display = i.style.display==='block'?'none':'block';
    if(i.style.display==='block') {
        document.getElementById('ic').innerHTML = p.inv.map(it => `<div class="is" onclick="useItem('${it.id}')">${IT[it.id].i}</div>`).join('');
    }
}

function useItem(id) {
    let it = IT[id];
    if(it.ef==='heal') { p.hp = Math.min(p.mhp, p.hp+it.v); notify("Soigné !"); }
    toggleInventory();
}

function resumeGame() { gs='play'; document.getElementById('pm').style.display='none'; }

window.onload = init;
</script>
</body>
</html>
